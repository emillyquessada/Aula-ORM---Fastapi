<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos // EduSys</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@300;500;600;700&display=swap');

:root {
    --bg-primary: #0a0a0a;
    --bg-panel: rgba(14, 14, 14, 0.88);
    --bg-card: rgba(17, 17, 17, 0.8);

    --text-primary: #f5f5f5;
    --text-secondary: #9a9a9a;
    --text-muted: #555555;

    --accent: #ff2b2b;
    --accent-hover: #ff3d3d;
    --accent-soft: rgba(255, 43, 43, 0.12);
    --accent-glow: rgba(255, 43, 43, 0.5);

    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.18);
    --border-hot: rgba(255, 43, 43, 0.45);

    --grid-line: rgba(255, 255, 255, 0.035);
    --grid-line-red: rgba(255, 43, 43, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    min-height: 100vh;
    background: var(--bg-primary);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    padding: 48px 24px;
    display: flex;
    justify-content: center;
    position: relative;
}

::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: rgba(255, 43, 43, 0.35); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* =========================================================
   BACKGROUND: GRID + SCANLINE
   ========================================================= */
.grid-bg {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(var(--grid-line-red) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line-red) 1px, transparent 1px);
    background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
    animation: grid-scroll 24s linear infinite;
    z-index: 0;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, #000 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
}

.grid-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, var(--accent-soft) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 43, 43, 0.07) 0%, transparent 48%);
    filter: blur(60px);
}

@keyframes grid-scroll {
    0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
    100% { background-position: 44px 44px, 44px 44px, 220px 220px, 220px 220px; }
}

.scanline {
    position: fixed;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
    box-shadow: 0 0 12px var(--accent-glow);
    z-index: 1;
    pointer-events: none;
    animation: scan 7s linear infinite;
    opacity: 0.5;
}

@keyframes scan {
    0%   { transform: translateY(0); }
    100% { transform: translateY(100vh); }
}

/* =========================================================
   CONTAINER
   ========================================================= */
.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 880px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    padding: 48px 44px 40px;
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.04),
        0 30px 80px -20px rgba(0, 0, 0, 0.85),
        0 0 60px -15px rgba(255, 43, 43, 0.18);
    animation: panel-in 0.7s cubic-bezier(.2, .8, .2, 1) both;
}

@keyframes panel-in {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Corner brackets */
.corner {
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
    filter: drop-shadow(0 0 6px var(--accent-glow));
    pointer-events: none;
}
.corner-tl { top: -1px; left: -1px;   border-top-width: 2px; border-left-width: 2px; }
.corner-tr { top: -1px; right: -1px;  border-top-width: 2px; border-right-width: 2px; }
.corner-bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
.corner-br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

/* =========================================================
   HEADER
   ========================================================= */
.header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 32px;
    padding-bottom: 22px;
    border-bottom: 1px dashed var(--border);
    flex-wrap: wrap;
}

.header-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    margin-bottom: 14px;
}

.badge-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
}

h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 42px;
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: var(--text-primary);
    text-transform: uppercase;
}

h1::after {
    content: '_';
    animation: blink 1s step-end infinite;
    margin-left: 6px;
    color: var(--accent);
    text-shadow: 0 0 22px var(--accent-glow);
}

@keyframes blink {
    0%, 50%   { opacity: 1; }
    51%, 100% { opacity: 0; }
}

.subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
    margin-top: 8px;
}

/* =========================================================
   BOTÃO "NOVO CURSO"
   ========================================================= */
.btn-new {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.25s, background 0.25s;
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.25),
        0 0 22px -6px var(--accent-glow),
        0 8px 24px -10px rgba(255, 43, 43, 0.5);
}

.btn-new::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
    transform: translateX(-100%);
    transition: transform 0.65s ease;
    pointer-events: none;
}

.btn-new:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.45),
        0 0 40px -6px var(--accent-glow),
        0 12px 30px -10px rgba(255, 43, 43, 0.65);
}

.btn-new:hover::before { transform: translateX(100%); }

.btn-new .plus {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
}
.btn-new-deletar {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.25s, background 0.25s;
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.25),
        0 0 22px -6px var(--accent-glow),
        0 8px 24px -10px rgba(255, 43, 43, 0.5);
}

.btn-new-deletar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
    transform: translateX(-100%);
    transition: transform 0.65s ease;
    pointer-events: none;
}

.btn-new-deletar:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.45),
        0 0 40px -6px var(--accent-glow),
        0 12px 30px -10px rgba(255, 43, 43, 0.65);
}

.btn-new-deletar:hover::before { transform: translateX(100%); }

.btn-new-deletar .plus {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
}

/* =========================================================
   LISTA DE CURSOS
   ========================================================= */
.cursos-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.cursos-list li {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-hot);
    transition: border-color 0.25s, transform 0.25s, background 0.25s, box-shadow 0.25s;
    counter-increment: curso-counter;
}

.cursos-list {
    counter-reset: curso-counter;
}

.cursos-list li::before {
    content: counter(curso-counter, decimal-leading-zero);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border-hot);
    padding: 6px 10px;
    min-width: 44px;
    text-align: center;
    flex-shrink: 0;
}

.cursos-list li::after {
    content: '→';
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--text-muted);
    margin-left: auto;
    transition: color 0.25s, transform 0.25s;
    flex-shrink: 0;
}

.cursos-list li:hover {
    border-color: var(--border-strong);
    border-left-color: var(--accent);
    background: rgba(255, 43, 43, 0.04);
    transform: translateX(4px);
    box-shadow: 0 12px 30px -18px rgba(255, 43, 43, 0.5);
}

.cursos-list li:hover::after {
    color: var(--accent);
    transform: translateX(4px);
}

.curso-nome {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: block;
    margin-bottom: 4px;
}

.curso-desc {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.45;
}

.curso-content {
    flex: 1;
    min-width: 0;
}

/* Empty state (caso não haja cursos) */
.cursos-list:empty::after {
    content: '// Nenhum curso cadastrado';
    display: block;
    padding: 40px 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    border: 1px dashed var(--border);
}

/* =========================================================
   FOOTER META
   ========================================================= */
.footer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
}

.status-online {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
}

.status-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 680px) {
    body { padding: 32px 16px; }

    .container { padding: 36px 24px 28px; }

    h1 { font-size: 30px; }

    .header { flex-direction: column; align-items: flex-start; }

    .btn-new {
        width: 100%;
        justify-content: center;
    }

    .cursos-list li {
        flex-wrap: wrap;
        padding: 16px;
        gap: 14px;
    }

    .cursos-list li::after {
        display: none;
    }
}
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <div class="container">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>

        <div class="header">
            <div>
                <div class="header-badge">
                    <span class="badge-dot"></span>
                    SYS // Catálogo de Cursos
                </div>
                <h1>Cursos</h1>
                <p class="subtitle">// Lista de todos os cursos disponíveis no sistema</p>
            </div>

            <a href="/cursos/cadastro" class="btn-new">
                <span class="plus">+</span>
                Novo Curso
            </a>
        </div>

        <ul class="cursos-list">
            {% for curso in cursos %}
            <li>
                <div class="curso-content">
                    <span class="curso-nome">{{ curso.nome }}</span>
                    <span class="curso-desc">{{ curso.descricao }}</span>
                    <span class="curso-desc"> | ⏱ Carga Horária: {{ curso.carga_hr}}</span>
                    <form action="/cursos/{{cursos.id}}/deletar" method="post">
                        <button class="btn-new-deletar" type="submit">Excluir</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>

        <div class="footer-meta">
            <span>v1.0.0 // secure</span>
            <span class="status-online">
                <span class="status-dot"></span>
                online
            </span>
        </div>
    </div>

</body>
</html>
