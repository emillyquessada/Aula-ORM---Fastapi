<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cursos</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@300;500;600;700&display=swap');

:root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-panel: rgba(14, 14, 14, 0.88);
    --bg-input: rgba(0, 0, 0, 0.45);
    --bg-input-hover: rgba(0, 0, 0, 0.65);
    --bg-input-focus: rgba(0, 0, 0, 0.85);

    --text-primary: #f5f5f5;
    --text-secondary: #9a9a9a;
    --text-muted: #555555;

    --accent: #ff2b2b;
    --accent-hover: #ff3d3d;
    --accent-soft: rgba(255, 43, 43, 0.12);
    --accent-glow: rgba(255, 43, 43, 0.5);

    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.18);
    --border-hot: rgba(255, 43, 43, 0.45);

    --grid-line: rgba(255, 255, 255, 0.035);
    --grid-line-red: rgba(255, 43, 43, 0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100vh;
    background: var(--bg-primary);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    position: relative;
}

::selection {
    background: var(--accent);
    color: #fff;
}

/* =========================================================
   ANIMATED GRID BACKGROUND
   ========================================================= */
.grid-bg {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(var(--grid-line-red) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line-red) 1px, transparent 1px);
    background-size: 44px 44px, 44px 44px, 220px 220px, 220px 220px;
    animation: grid-scroll 24s linear infinite;
    z-index: 0;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, #000 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
}

.grid-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 18% 28%, var(--accent-soft) 0%, transparent 42%),
        radial-gradient(circle at 82% 72%, rgba(255, 43, 43, 0.07) 0%, transparent 48%);
    filter: blur(50px);
}

@keyframes grid-scroll {
    0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
    100% { background-position: 44px 44px, 44px 44px, 220px 220px, 220px 220px; }
}

/* Horizontal scanline */
.scanline {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
    box-shadow: 0 0 12px var(--accent-glow);
    z-index: 1;
    pointer-events: none;
    animation: scan 7s linear infinite;
    opacity: 0.55;
}

@keyframes scan {
    0%   { transform: translateY(0); }
    100% { transform: translateY(100vh); }
}

/* =========================================================
   CONTAINER / PANEL
   ========================================================= */
.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: var(--bg-panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    padding: 52px 48px 36px;
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.04),
        0 30px 80px -20px rgba(0, 0, 0, 0.85),
        0 0 60px -15px rgba(255, 43, 43, 0.18);
    animation: panel-in 0.7s cubic-bezier(.2, .8, .2, 1) both;
}

@keyframes panel-in {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Corner brackets */
.corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
    filter: drop-shadow(0 0 6px var(--accent-glow));
    pointer-events: none;
}
.corner-tl { top: -1px; left: -1px;   border-top-width: 2px; border-left-width: 2px; }
.corner-tr { top: -1px; right: -1px;  border-top-width: 2px; border-right-width: 2px; }
.corner-bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
.corner-br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

/* =========================================================
   HEADER
   ========================================================= */
.header-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    margin-bottom: 22px;
}

.badge-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
}

h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: var(--text-primary);
    margin-bottom: 10px;
    text-transform: uppercase;
}

h1 .accent {
    color: var(--accent);
    text-shadow: 0 0 22px var(--accent-glow);
    position: relative;
    display: inline-block;
}

h1 .accent::after {
    content: '_';
    animation: blink 1s step-end infinite;
    margin-left: 4px;
    color: var(--accent);
}

@keyframes blink {
    0%, 50%   { opacity: 1; }
    51%, 100% { opacity: 0; }
}

.subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-bottom: 36px;
    letter-spacing: 0.05em;
    line-height: 1.5;
}

/* =========================================================
   FORM
   ========================================================= */
.form-group {
    margin-bottom: 22px;
    position: relative;
}

label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 10px;
}

.label-index {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border: 1px solid var(--border-hot);
    letter-spacing: 0.12em;
    line-height: 1.2;
}

input[type="text"],
input[type="number"] {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    padding: 14px 16px;
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.015em;
    outline: none;
    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background-color 0.25s ease;
}

input::placeholder {
    color: var(--text-muted);
    font-weight: 300;
}

input:hover {
    border-color: var(--border-strong);
    background: var(--bg-input-hover);
}

input:focus {
    border-color: var(--accent);
    background: var(--bg-input-focus);
    box-shadow:
        0 0 0 1px var(--accent),
        0 0 18px -4px var(--accent-glow),
        inset 0 0 12px rgba(255, 43, 43, 0.06);
}

/* Remove number input spinners */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
input[type="number"] { -moz-appearance: textfield; }

/* =========================================================
   BUTTON
   ========================================================= */
button[type="submit"] {
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    padding: 16px 24px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        background-color 0.25s ease;
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.25),
        0 0 22px -6px var(--accent-glow),
        0 8px 24px -10px rgba(255, 43, 43, 0.5);
}

button[type="submit"]::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.28),
        transparent
    );
    transform: translateX(-100%);
    transition: transform 0.65s ease;
    pointer-events: none;
}

button[type="submit"]:hover {
    background: var(--accent-hover);
    box-shadow:
        0 0 0 1px rgba(255, 43, 43, 0.45),
        0 0 40px -6px var(--accent-glow),
        0 12px 30px -10px rgba(255, 43, 43, 0.65);
    transform: translateY(-2px);
}

button[type="submit"]:hover::before {
    transform: translateX(100%);
}

button[type="submit"]:active {
    transform: translateY(0);
}

button[type="submit"]:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
}

.btn-arrow {
    font-size: 18px;
    line-height: 1;
    transition: transform 0.25s ease;
}

button[type="submit"]:hover .btn-arrow {
    transform: translateX(4px);
}

/* =========================================================
   FOOTER META
   ========================================================= */
.footer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
}

.status-online {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
}

.status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 560px) {
    body {
        padding: 32px 16px;
    }

    .container {
        padding: 36px 24px 28px;
    }

    h1 {
        font-size: 30px;
    }

    .subtitle {
        margin-bottom: 28px;
        font-size: 11px;
    }

    button[type="submit"] {
        letter-spacing: 0.18em;
        font-size: 13px;
    }

    .footer-meta {
        font-size: 9px;
        letter-spacing: 0.14em;
    }
}
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <div class="container">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>

        <div class="header-badge">
            <span class="badge-dot"></span>
            SYS // NEW_REGISTRY
        </div>

        <h1>Cadastrar <span class="accent">Curso</span></h1>
        <p class="subtitle">// Preencha os dados para registrar um novo curso no sistema</p>

        <form action="/cursos" method="post">
            <div class="form-group">
                <label for="nome">
                    <span class="label-index">01</span>
                    Nome do Curso
                </label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Desenvolvimento Web" required>
            </div>

            <div class="form-group">
                <label for="carga_hr">
                    <span class="label-index">02</span>
                    Carga Horária (horas)
                </label>
                <input type="number" id="carga_hr" name="carga_hr" placeholder="Ex: 40" required>
            </div>

            <div class="form-group">
                <label for="descricao">
                    <span class="label-index">03</span>
                    Descrição
                </label>
                <input type="text" id="descricao" name="descricao" placeholder="Breve resumo do curso">
            </div>

            <button type="submit">
                <span>Cadastrar Agora</span>
                <span class="btn-arrow">→</span>
            </button>
        </form>

        <div class="footer-meta">
            <span>v1.0.0 // secure</span>
            <span class="status-online">
                <span class="status-dot"></span>
                online
            </span>
        </div>
    </div>

</body>
</html>
